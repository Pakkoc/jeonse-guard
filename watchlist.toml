# jeonse-guard 워치리스트 예시.
# 이 파일을 watchlist.toml로 복사한 뒤 항목을 채워 사용한다:
#   cp watchlist.example.toml watchlist.toml
#   python -m jeonse_guard.cli watch --watchlist watchlist.toml
#
# id·address는 필수, 나머지는 선택이다.

[[entry]]
id = "home"                        # 스냅샷 파일명 키 (snapshots/<id>.json, reports/<id>-latest.md)
address = "서울 마포구 성산동 200-1"  # 지번 주소 (필수)
deposit_10k = 35000                # 전세보증금, 만원 단위 (선택 — 3억5천 = 35000)
unit_name = "성산시영"              # 단지/건물명 필터 (선택)
area_m2 = 50.0                     # 전용면적 ㎡ (선택, ±15% 면적대 매칭)
asset_type = "apartment"           # apartment | villa | officetel | single-house (선택, 기본 apartment)

# 항목을 더 감시하려면 [[entry]] 블록을 추가한다.
# [[entry]]
# id = "office"
# address = "서울 강남구 역삼동 123-45"
# asset_type = "officetel"
